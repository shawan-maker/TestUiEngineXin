# inbox.yaml — 站内信模块 L3 关键字定义
#
# 模块级 workflow，供 Excel 中以 L3 调用方式使用，如：
#   检查站内信显示(任务提醒)
#
# 由 compile_module_keywords.py 编译为 Python 函数，
# 注册到 KeyWordManager.maps，运行时按 name 查找。

workflows:

  # ── 关键字：检查站内信显示（1 参数）──
  # 点击 tab → 检查消息数量 → 有条件查看详情 → 断言标题一致
  - name: check_inbox_display
    chinese_name: 检查站内信显示
    params: [tab_name]
    description: "点击tab → 获取消息数量 → 数量>0则查看详情并断言标题一致，数量=0则跳过"

    trigger_pattern:
      - '点击Q?{tab_name}Q?tab'
      - '如果Q?{tab_name}Q?.*数量.*大于\s*0.*点击'

    locators:
      tab: "xpath=//*[contains(text(),'{tab_name}') and @role='tab']"
      message_list: "xpath=//div[contains(@class,'left-item')]"
      first_message: "xpath=(//div[contains(@class,'left-item')])[1]"
      title_in_list: "xpath=(//div[contains(@class,'left-item')]//*[contains(@class,'title-label')])[1]"
      detail_title: "xpath=//div[contains(@class,'tree-right')]//*[contains(@class,'title-label')]"

    steps:
      # 1. 点击 tab
      - keyword: click_element
        desc: "点击{tab_name}tab"
        params:
          locator: "${locators.tab}"

      # 2. 获取消息数量
      - keyword: get_element_count
        desc: "获取消息数量"
        params:
          locator: "${locators.message_list}"
          variable: "_inbox_msg_count"
        compile: count_and_store

      # 3. 如果数量 > 0，查看详情并断言
      - keyword: if_variable
        desc: "如果消息数量大于0"
        condition: "_inbox_msg_count > 0"
        then_steps:
          # 3a. 获取列表中的标题文本
          - keyword: get_text
            desc: "获取列表中第一条标题"
            params:
              locator: "${locators.title_in_list}"
              variable: "_inbox_list_title"
            compile: text_and_store

          # 3b. 点击第一条消息
          - keyword: click_element
            desc: "点击第一条消息"
            params:
              locator: "${locators.first_message}"

          # 3c. 等待详情加载
          - keyword: wait_for_time
            desc: "等待详情加载"
            params:
              timeout: 1000

          # 3d. 断言详情页标题与列表标题一致
          - keyword: except_to_be_visible
            desc: "断言详情页显示相同标题"
            params:
              locator: "xpath=//div[contains(@class,'tree-right')]//*[contains(.,'{_inbox_list_title}')]"
