[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ui_engine_xin"
version = "0.0.11"
description = "基于 Playwright 的关键字驱动 UI 自动化测试引擎"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Shawn", email = "xiaoh0525@xiaoh.com"}
]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "pyyaml>=6.0",
]
keywords = ["python", "playwright", "ui-automation", "keyword-driven", "testing", "uiEngine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-playwright>=0.4",
    "build",
]

[project.urls]
Homepage = "https://pypi.org/project/ui_engine_xin/"

[tool.setuptools.packages.find]
include = ["UIEngine*"]

[tool.setuptools.package-data]
UIEngine = ["config/*.yaml"]
