# homepage_list.yaml — 首页列表校验关键字
#
# 模块级 workflow，供 Excel 中以 L3 调用方式使用，如：
#   首页列表校验(XX区域)
#
# 由 compile_module_keywords.py 编译为 Python 函数，
# 注册到 KeyWordManager.maps，运行时按 name 查找。

workflows:

  # ── 关键字：首页列表校验（1 参数）──
  # 判断指定区域的列表行是否存在可点击链接，>0 则点击第一条
  - name: check_homepage_list
    chinese_name: 首页列表校验
    params: [region_name]
    description: "获取指定区域列表行数量 → 数量>0则点击第一条链接"

    trigger_pattern:
      - '首页.*Q?{region_name}Q?.*校验'
      - '检查.*Q?{region_name}Q?.*列表'

    locators:
      row_link: "xpath=//*[contains(text(),'{region_name}')]//following-sibling::div//table//tr[contains(@class,'el-table__row')]//span[contains(@class,'click-style-class')]"
      first_row_link: "xpath=(//*[contains(text(),'{region_name}')]//following-sibling::div//table//tr[contains(@class,'el-table__row')]//span[contains(@class,'click-style-class')])[1]"

    steps:
      # 1. 获取列表行链接数量
      - keyword: get_element_count
        desc: "获取{region_name}区域列表行数量"
        params:
          locator: "${locators.row_link}"
          variable: "_homepage_row_count"
        compile: count_and_store

      # 2. 如果数量 > 0，点击第一条链接
      - keyword: if_variable
        desc: "如果列表行数量大于0"
        condition: "_homepage_row_count > 0"
        then_steps:
          - keyword: click_element
            desc: "点击{region_name}第一条链接"
            params:
              locator: "${locators.first_row_link}"
